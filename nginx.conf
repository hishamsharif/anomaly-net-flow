server {
    listen 80;

    # Serve the React SPA — unknown paths fall back to index.html (client-side routing)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API calls and health check to the FastAPI container
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # training status polling needs a long timeout

        # SSE (Server-Sent Events) — disable nginx buffering so training progress
        # events reach the browser immediately instead of queuing in the buffer.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        '';
        proxy_http_version 1.1;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
